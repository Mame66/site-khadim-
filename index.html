<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cours particuliers — Français, Histoire-Géo, Philosophie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1d2640; --ink2:#4a5270; --mute:#7a8099; --paper:#faf7f2; --card:#fff; --line:#e9e3d8;
  --accent:#c8553d; --accent-d:#a8432e; --soft:#f3ece1; --ok:#2f7d6d; --warn:#b7791f; --bad:#c0392b;
  --fr:#c8553d; --hi:#8a5a2b; --geo:#2f7d6d; --phi:#4b4f9c;
  --r:14px; --shadow:0 1px 2px rgba(29,38,64,.06),0 4px 16px rgba(29,38,64,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--paper);line-height:1.5;font-size:16px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;line-height:1.15;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--accent)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;font-weight:600;font-size:15px;transition:.15s}
.btn-p{background:var(--accent);color:#fff}.btn-p:hover{background:var(--accent-d)}
.btn-s{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}.btn-s:hover{border-color:var(--ink2)}
.btn-sm{min-height:36px;padding:0 14px;font-size:14px}
.btn-block{width:100%}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--soft);color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.muted{color:var(--mute)}
.small{font-size:13.5px}

/* ---------- PUBLIC ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(250,247,242,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700}
.logo-m{width:36px;height:36px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:Fraunces,serif;font-size:17px}
.logo small{display:block;font-weight:500;font-size:12px;color:var(--mute);margin-top:-3px}
.hero{padding:44px 0 36px}
.kicker{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-size:clamp(34px,8vw,58px);margin:12px 0 16px}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero p.lead{font-size:18px;color:var(--ink2);max-width:560px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0 22px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badges span{font-size:13.5px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink2)}
.hero-grid{display:grid;gap:28px}
.hero-card{padding:20px;position:relative;overflow:hidden}
.hero-card h3{font-size:18px;margin-bottom:12px}
.mini{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.mini:first-of-type{border-top:0}
.mini .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#fff;font-weight:700;flex:none}
.mini b{display:block;font-size:14.5px}
.sec{padding:44px 0}
.sec h2{font-size:clamp(26px,5vw,36px);margin-bottom:8px}
.sec .sub{color:var(--ink2);margin-bottom:24px;max-width:600px}
.grid{display:grid;gap:14px}
.subj{padding:20px}
.subj .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-family:Fraunces,serif;font-size:20px;margin-bottom:12px}
.subj h3{font-size:20px;margin-bottom:6px}
.subj p{color:var(--ink2);font-size:15px}
.subj ul{list-style:none;margin-top:12px;display:flex;flex-wrap:wrap;gap:6px}
.subj li{font-size:12.5px;background:var(--soft);padding:3px 9px;border-radius:999px;color:var(--ink2)}
.offer{padding:22px;display:flex;flex-direction:column}
.offer h3{font-size:21px}
.offer .price{font-family:Fraunces,serif;font-size:28px;margin:10px 0 2px}
.offer .price small{font-family:Inter;font-size:14px;color:var(--mute)}
.offer ul{list-style:none;margin:14px 0 0;display:grid;gap:8px;font-size:15px;color:var(--ink2)}
.offer li:before{content:"✓";color:var(--ok);font-weight:700;margin-right:8px}
.offer.feat{background:var(--ink);color:#fff;border-color:var(--ink)}
.offer.feat ul{color:#d6d9e6}.offer.feat .price small{color:#aeb3c8}
.steps{counter-reset:s}
.step{padding:20px;display:flex;gap:14px}
.step:before{counter-increment:s;content:counter(s);flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700}
.step h3{font-size:18px;margin-bottom:4px}
.step p{color:var(--ink2);font-size:15px}
.platform{background:var(--ink);color:#fff;border-radius:22px;padding:28px 22px}
.platform h2{color:#fff}
.platform .sub{color:#c7cbe0}
.pf{display:grid;gap:12px}
.pf div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:14px 16px}
.pf b{display:block;margin-bottom:2px}
.pf span{color:#c7cbe0;font-size:14.5px}
.form{display:grid;gap:14px}
.field label{display:block;font-size:13.5px;font-weight:600;margin-bottom:6px;color:var(--ink2)}
.field input,.field select,.field textarea{width:100%;min-height:48px;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:16px;outline:none}
.field textarea{min-height:110px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.row2{display:grid;gap:14px}
.contact{padding:22px}
footer{padding:30px 0 40px;color:var(--mute);font-size:14px;border-top:1px solid var(--line);margin-top:20px}
.ph{background:#fff4d6;border-radius:4px;padding:0 3px}

/* ---------- LOGIN ---------- */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .card{width:100%;max-width:420px;padding:28px 22px}
.login h1{font-size:28px;margin:18px 0 6px}
.demo{display:grid;gap:10px;margin-top:18px;padding-top:18px;border-top:1px dashed var(--line)}

/* ---------- APP ---------- */
.app{min-height:100vh;padding-bottom:84px}
.abar{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--line)}
.abar .in{display:flex;align-items:center;justify-content:space-between;height:60px;padding:0 16px;max-width:1080px;margin:0 auto}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.main{max-width:760px;margin:0 auto;padding:20px 16px}
.main h2{font-size:26px;margin-bottom:4px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:11.5px;font-weight:600;color:var(--mute);position:relative}
.nav button.on{color:var(--accent)}
.nav svg{width:23px;height:23px}
.nb{position:absolute;top:4px;left:calc(50% + 6px);background:var(--accent);color:#fff;font-size:10.5px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.stat{padding:14px 16px}
.stat b{font-family:Fraunces,serif;font-size:30px;display:block;line-height:1.1}
.stat span{font-size:13px;color:var(--mute)}
.list{display:grid;gap:10px}.list>*{min-width:0}
.item{padding:14px 16px;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%}
button.item:active{transform:scale(.99)}
.item .bar{width:4px;align-self:stretch;border-radius:4px;flex:none}
.item .body{flex:1;min-width:0}
.item h4{font-size:15.5px;font-weight:600;margin-bottom:2px}
.item p{font-size:13.5px;color:var(--mute)}
.item .right{text-align:right;flex:none;font-size:13px}
.tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.t-ok{background:#e3f1ec;color:var(--ok)}.t-warn{background:#fbf0d9;color:var(--warn)}.t-bad{background:#f9e1de;color:var(--bad)}.t-n{background:var(--soft);color:var(--ink2)}
.h3{font-family:Inter;font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);font-weight:700;margin:24px 0 10px}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none}
.filters button{white-space:nowrap;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-size:14px;font-weight:600;color:var(--ink2)}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{padding:26px;text-align:center;color:var(--mute);font-size:14.5px}
.unread h4:after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-left:8px;vertical-align:middle}
.fileic{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.req{padding:14px 16px}
.checks{display:grid;gap:8px;max-height:200px;overflow:auto;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.checks label{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:500;color:var(--ink)}
.checks input{width:20px;height:20px;accent-color:var(--accent)}
.sub-box{padding:14px;border:1px solid var(--line);border-radius:12px;margin-top:10px;background:var(--paper)}
.quote{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14.5px;margin:8px 0;white-space:pre-wrap}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;display:none}
#sheet.open{display:block}
.bd{position:absolute;inset:0;background:rgba(20,24,40,.45)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--paper);border-radius:20px 20px 0 0;padding:8px 18px 28px;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.ph2{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.ph2 h3{font-size:21px}
.x{width:36px;height:36px;border-radius:50%;background:#fff;border:1px solid var(--line);font-size:18px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;text-align:center}
#toast.show{opacity:1}
.demo-banner{background:#fff4d6;color:#7a5a12;font-size:12.5px;text-align:center;padding:6px 12px}

@media(min-width:720px){
  .hero{padding:72px 0 56px}
  .hero-grid{grid-template-columns:1.3fr 1fr;align-items:center}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g4{grid-template-columns:repeat(4,1fr)}
  .row2{grid-template-columns:1fr 1fr}
  .platform{padding:44px}
  .pf{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:repeat(4,1fr)}
  .panel{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:560px;border-radius:20px;animation:none}
  .grab{display:none}
}
@media(min-width:1000px){
  .app{padding-bottom:0;padding-left:220px}
  .nav{top:0;right:auto;width:220px;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:110px 12px 0;gap:4px}
  .nav button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:11px 14px;border-radius:10px}
  .nav button.on{background:var(--soft)}
  .nb{position:static;margin-left:auto}
  .abar{position:fixed;left:0;right:0;z-index:35}
  .main{padding-top:112px}
  #toast{bottom:30px}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>
<script>
/* ===================== Données de démonstration ===================== */
const TODAY = new Date('2026-10-27T12:00:00');
const SUBJ = {
  'Français':{c:'var(--fr)',l:'Fr'}, 'Histoire':{c:'var(--hi)',l:'H'},
  'Géographie':{c:'var(--geo)',l:'G'}, 'Philosophie':{c:'var(--phi)',l:'φ'}
};
const LEVELS = ['Primaire','Collège','Lycée','Supérieur','Adulte'];
let uid = 100; const nid = p => p + (++uid);

const S = {
  view:'public', user:null, tab:null, filter:'Tous',
  students:[
    {id:'s1',name:'Léa Martin',level:'Terminale',subjects:['Philosophie','Histoire'],mode:'En ligne',email:'lea.martin@exemple.fr'},
    {id:'s2',name:'Yanis Benali',level:'3e',subjects:['Français','Histoire'],mode:'À domicile',email:'yanis.b@exemple.fr'},
    {id:'s3',name:'Chloé Dubois',level:'1re',subjects:['Français','Géographie'],mode:'En ligne',email:'chloe.d@exemple.fr'},
    {id:'s4',name:'Tom Roux',level:'CM2',subjects:['Français'],mode:'À domicile',email:'parents.roux@exemple.fr'}
  ],
  courses:[
    {id:'c1',subject:'Philosophie',title:'La conscience — cours complet',type:'PDF',file:'conscience.pdf',date:'2026-10-20',to:['s1']},
    {id:'c2',subject:'Philosophie',title:'Méthode de la dissertation',type:'PDF',file:'methode-dissertation.pdf',date:'2026-10-13',to:['s1']},
    {id:'c3',subject:'Histoire',title:'La Guerre froide (1947-1991) — fiche',type:'PDF',file:'guerre-froide.pdf',date:'2026-10-22',to:['s1','s2']},
    {id:'c4',subject:'Français',title:'Le commentaire de texte pas à pas',type:'Vidéo',file:'commentaire.mp4',date:'2026-10-18',to:['s3']},
    {id:'c5',subject:'Géographie',title:'Croquis : la mondialisation',type:'PDF',file:'croquis-mondialisation.pdf',date:'2026-10-15',to:['s3']},
    {id:'c6',subject:'Français',title:'Les classes grammaticales',type:'PDF',file:'grammaire.pdf',date:'2026-10-21',to:['s2','s4']}
  ],
  hw:[
    {id:'h1',subject:'Philosophie',title:'Dissertation : « Peut-on se connaître soi-même ? »',desc:'Introduction complète + plan détaillé (I, II, III avec sous-parties). 2 pages maximum.',due:'2026-10-30',to:['s1'],subs:{}},
    {id:'h2',subject:'Histoire',title:'Fiche de révision : crise de Cuba',desc:'Chronologie, acteurs, enjeux. Une page.',due:'2026-11-03',to:['s1','s2'],subs:{s2:{text:'Voici ma fiche, j\'ai ajouté une carte.',file:'cuba-yanis.jpg',date:'2026-10-26'}}},
    {id:'h3',subject:'Philosophie',title:'Explication de texte — Descartes',desc:'Repérer la thèse et les étapes de l\'argumentation.',due:'2026-10-22',to:['s1'],subs:{s1:{text:'Thèse : le cogito comme première certitude…',file:'descartes.pdf',date:'2026-10-21',grade:'14/20',comment:'Bonne analyse de la thèse. Travaille les transitions.'}}},
    {id:'h4',subject:'Français',title:'Commentaire : Baudelaire, « L\'Albatros »',desc:'Deux axes de lecture rédigés.',due:'2026-11-05',to:['s3'],subs:{}},
    {id:'h5',subject:'Français',title:'Dictée préparée n°4',desc:'Apprendre la liste de mots, dictée au prochain cours.',due:'2026-10-29',to:['s4'],subs:{}}
  ],
  msgs:[
    {id:'m1',from:'prof',to:'all',subject:'Vacances de la Toussaint',body:'Bonjour à tous,\nLes cours continuent pendant les vacances pour ceux qui le souhaitent. Pensez à me confirmer vos créneaux.\nBonne semaine !',date:'2026-10-24',readBy:[]},
    {id:'m2',from:'prof',to:'s1',subject:'Bac blanc de philo',body:'Léa, on fera un entraînement en conditions réelles (4h) samedi prochain. Prévois ton brouillon !',date:'2026-10-26',readBy:[]},
    {id:'m3',from:'s2',to:'prof',subject:'Question sur la fiche',body:'Bonjour, est-ce que je peux faire la fiche à la main et l\'envoyer en photo ?',date:'2026-10-25',readBy:[]}
  ],
  reqs:[
    {id:'r1',name:'Mme Lefèvre',contact:'06 00 00 00 00',level:'Lycée',subject:'Français',mode:'À domicile',msg:'Pour ma fille en 1re, préparation du bac de français.',date:'2026-10-26',done:false}
  ]
};

/* ===================== Utilitaires ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const days = d => Math.round((new Date(d+'T12:00:00') - TODAY)/864e5);
const iso = () => TODAY.toISOString().slice(0,10);
const stu = id => S.students.find(s => s.id===id);
const initials = n => n.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
const sc = s => (SUBJ[s]||{c:'var(--ink2)'}).c;
const isProf = () => S.user==='prof';
const me = () => stu(S.user);

function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),3200)}
function openSheet(title, html){
  $('#sheet').innerHTML = `<div class="bd" data-act="close"></div><div class="panel" role="dialog" aria-label="${esc(title)}"><div class="grab"></div><div class="ph2"><h3>${esc(title)}</h3><button class="x" data-act="close" aria-label="Fermer">✕</button></div>${html}</div>`;
  $('#sheet').classList.add('open'); document.body.style.overflow='hidden';
}
function closeSheet(){ $('#sheet').classList.remove('open'); $('#sheet').innerHTML=''; document.body.style.overflow=''; }
function dueTag(d, done){
  if(done) return '';
  const n = days(d);
  if(n<0) return `<span class="tag t-bad">En retard</span>`;
  if(n===0) return `<span class="tag t-bad">Aujourd'hui</span>`;
  if(n<=3) return `<span class="tag t-warn">Dans ${n} j</span>`;
  return `<span class="tag t-n">${fmt(d)}</span>`;
}
const opts = (arr, sel) => arr.map(x=>`<option ${x===sel?'selected':''}>${esc(x)}</option>`).join('');

/* ===================== Icônes ===================== */
const I = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.5 3.5 5.2"/>',
  task:'<rect x="4" y="3.5" width="16" height="17" rx="2.5"/><path d="M8 9l2 2 4-4M8 16h8"/>',
  book:'<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20v3H6.5"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/>',
  out:'<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/>'
};
const icon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;

/* ===================== Page publique ===================== */
function publicHTML(){
  const subjects = [
    ['Français','Orthographe, grammaire, lecture, rédaction, commentaire et dissertation, préparation au bac de français.',['Primaire','Collège','Lycée','Adultes']],
    ['Histoire','Comprendre les grandes périodes, maîtriser les repères, réussir la composition et l\'analyse de document.',['Collège','Lycée','Supérieur']],
    ['Géographie','Croquis, schémas, études de cas : apprendre à lire le monde et à le représenter.',['Collège','Lycée','Supérieur']],
    ['Philosophie','Les notions du programme, la méthode de la dissertation et de l\'explication de texte. Prépa bac.',['Terminale','Supérieur','Adultes']]
  ];

/* ===================== Espace connecté ===================== */
function counts(){
  if(isProf()){
    const toGrade = S.hw.reduce((n,h)=>n+Object.values(h.subs).filter(s=>!s.grade).length,0);
    const unread = S.msgs.filter(m=>m.to==='prof'&&!m.readBy.includes('prof')).length;
    const reqs = S.reqs.filter(r=>!r.done).length;
    return {toGrade,unread,reqs};
  }
  const id=S.user;
  const todo = S.hw.filter(h=>h.to.includes(id)&&!h.subs[id]).length;
  const unread = S.msgs.filter(m=>(m.to===id||m.to==='all')&&m.from!==id&&!m.readBy.includes(id)).length;
  return {todo,unread};
}
function appShell(){
  const c = counts();
  const tabs = isProf()
    ? [['tableau','Accueil','home',c.reqs],['eleves','Élèves','users',0],['devoirs','Devoirs','task',c.toGrade],['cours','Cours','book',0],['messages','Messages','mail',c.unread]]
    : [['devoirs','Devoirs','task',c.todo],['cours','Cours','book',0],['messages','Messages','mail',c.unread]];
  const name = isProf() ? 'Professeur' : me().name;
  const views = {tableau:vDash,eleves:vStudents,devoirs:isProf()?vProfHw:vStuHw,cours:isProf()?vProfCourses:vStuCourses,messages:vMsgs};
  return `<div class="app">
    <div class="abar"><div class="demo-banner">Prototype de démonstration — les données sont fictives et se réinitialisent au rechargement</div><div class="in">
      <div class="logo"><div class="logo-m">VN</div><div>${esc(name)}<small>${isProf()?'Espace professeur':'Espace élève · '+esc(me().level)}</small></div></div>
      <button class="btn btn-s btn-sm" data-act="logout" aria-label="Se déconnecter">${icon('out').replace('<svg','<svg width="18" height="18"')} <span>Quitter</span></button>
    </div></div>
    <nav class="nav">${tabs.map(([k,l,ic,n])=>`<button class="${S.tab===k?'on':''}" data-act="tab" data-id="${k}">${icon(ic)}<span>${l}</span>${n?`<span class="nb">${n}</span>`:''}</button>`).join('')}</nav>
    <main class="main" style="${innerWidth>=1000?'':''}">${views[S.tab]()}</main>
  </div>`;
}

function filterBar(subjects){
  const all=['Tous',...(subjects||Object.keys(SUBJ))];
  return `<div class="filters">${all.map(s=>`<button class="${S.filter===s?'on':''}" data-act="filter" data-id="${s}">${s}</button>`).join('')}</div>`;

function courseList(list, prof){
  list=list.filter(c=>S.filter==='Tous'||c.subject===S.filter).sort((a,b)=>b.date.localeCompare(a.date));
  if(!list.length) return '<div class="card empty">Aucun cours dans cette matière.</div>';
  return list.map(c=>`<button class="card item" data-act="openCourse" data-id="${c.id}"><div class="fileic" style="background:${sc(c.subject)}">${c.type==='Vidéo'?'▶':c.type==='Lien'?'↗':'PDF'}</div>

}

  <div class="h3">Rendus</div>

  return `<div class="phead"><div><h2>Messages</h2><p class="muted">${isProf()?'Écrire à un élève ou à toute la classe':'Échanges avec le professeur'}</p></div><button class="btn btn-p btn-sm" data-act="newMsg">+ Nouveau</button></div>
  <div class="list">${list.map(m=>`<button class="card item ${unread(m)?'unread':''}" data-act="readMsg" data-id="${m.id}"><div class="avatar" style="background:${m.from==='prof'?'var(--ink)':'var(--accent)'}">${m.from==='prof'?'VN':initials(stu(m.from).name)}</div>
    <div class="body"><h4>${esc(m.subject)}</h4><p>${esc(who(m))}</p><p style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.body.split('\n')[0])}</p></div><div class="right muted">${fmt(m.date)}</div></button>`).join('')}</div>`;
}
function readMsg(id){
  const m=S.msgs.find(x=>x.id===id);
  if(!m.readBy.includes(S.user)) m.readBy.push(S.user);
  const from = m.from==='prof'?'Professeur':stu(m.from).name;
  const canReply = m.from!==S.user;
  const replyTo = isProf()?m.from:'prof';
  openSheet(m.subject, `<p class="small muted">${esc(from)} · ${fmt(m.date)}</p><div class="quote" style="font-size:15.5px">${esc(m.body)}</div>
   ${canReply?`<form class="form" data-form="reply" data-id="${m.id}|${replyTo}" style="margin-top:12px"><div class="field"><label for="rp">Répondre</label><textarea id="rp" name="body" required></textarea></div><button class="btn btn-p btn-block">Envoyer</button></form>`:''}`);
  render();
}
function newMsg(to){
  if(!isProf()){
    openSheet('Message au professeur', `<form class="form" data-form="newMsg"><input type="hidden" name="to" value="prof">
      <div class="field"><label for="ms">Objet</label><input id="ms" name="subject" required></div>
      <div class="field"><label for="mb">Message</label><textarea id="mb" name="body" required></textarea></div>
      <button class="btn btn-p btn-block">Envoyer</button></form>`); return;
  }
  openSheet('Nouveau message', `<form class="form" data-form="newMsg">
    <div class="field"><label for="mt">Destinataire</label><select id="mt" name="to"><option value="all">Tous les élèves</option>${S.students.map(s=>`<option value="${s.id}" ${s.id===to?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
    <div class="field"><label for="ms">Objet</label><input id="ms" name="subject" required></div>
    <div class="field"><label for="mb">Message</label><textarea id="mb" name="body" required></textarea></div>
    <label class="small" style="display:flex;gap:8px;align-items:center"><input type="checkbox" name="email" checked style="width:18px;height:18px;accent-color:var(--accent)"> Envoyer aussi par email</label>
    <button class="btn btn-p btn-block">Envoyer</button></form>`);
}

/* ---- Formulaires prof ---- */
const studentChecks = (sel=[]) => `<div class="checks">${S.students.map(s=>`<label><input type="checkbox" name="to" value="${s.id}" ${sel.includes(s.id)?'checked':''}> ${esc(s.name)} <span class="muted small">(${esc(s.level)})</span></label>`).join('')}</div>`;
function newHw(){
  const d=new Date(TODAY);d.setDate(d.getDate()+7);
  openSheet('Nouveau devoir', `<form class="form" data-form="newHw">
    <div class="row2"><div class="field"><label>Matière</label><select name="subject">${opts(Object.keys(SUBJ))}</select></div>
    <div class="field"><label>Date limite</label><input type="date" name="due" required value="${d.toISOString().slice(0,10)}"></div></div>
    <div class="field"><label>Titre</label><input name="title" required placeholder="ex. Dissertation : la liberté"></div>
    <div class="field"><label>Consignes</label><textarea name="desc" required></textarea></div>
    <div class="field"><label>Pour quels élèves ?</label>${studentChecks()}</div>
    <button class="btn btn-p btn-block">Publier le devoir</button></form>`);
}
function newCourse(){
  openSheet('Ajouter un cours', `<form class="form" data-form="newCourse">
    <div class="row2"><div class="field"><label>Matière</label><select name="subject">${opts(Object.keys(SUBJ))}</select></div>
    <div class="field"><label>Type</label><select name="type">${opts(['PDF','Vidéo','Lien'])}</select></div></div>
    <div class="field"><label>Titre</label><input name="title" required></div>
    <div class="field"><label>Fichier</label><input type="file" name="file"></div>
    <div class="field"><label>Partager avec</label>${studentChecks()}</div>
    <button class="btn btn-p btn-block">Ajouter</button></form>`);
}
function newStudent(pref={}){
  openSheet('Nouvel élève', `<form class="form" data-form="newStudent" ${pref.req?`data-id="${pref.req}"`:''}>
    <div class="field"><label>Nom complet</label><input name="name" required value="${esc(pref.name||'')}"></div>
    <div class="field"><label>Email (identifiant de connexion)</label><input name="email" type="email" required value="${esc(pref.email||'')}"></div>
    <div class="row2"><div class="field"><label>Classe / niveau</label><input name="level" required placeholder="ex. 2de" value="${esc(pref.level||'')}"></div>
    <div class="field"><label>Formule</label><select name="mode">${opts(['En ligne','À domicile'],pref.mode)}</select></div></div>
    <div class="field"><label>Matières</label><div class="checks">${Object.keys(SUBJ).map(s=>`<label><input type="checkbox" name="subjects" value="${s}" ${pref.subject===s?'checked':''}> ${s}</label>`).join('')}</div></div>
    <button class="btn btn-p btn-block">Créer le compte et envoyer l'invitation</button></form>`);
}

/* ===================== Navigation & actions ===================== */
function go(view, tab){ S.view=view; S.tab=tab||null; S.filter='Tous'; closeSheet(); render(); scrollTo(0,0); }
function render(){ $('#app').innerHTML = S.view==='public'?publicHTML():S.view==='login'?loginHTML():appShell(); }

const ACT = {
  login:()=>go('login'), home:()=>go('public'),
  scroll:id=>document.getElementById(id).scrollIntoView({behavior:'smooth'}),
  as:id=>{ S.user=id; go('app', id==='prof'?'tableau':'devoirs'); },
  logout:()=>{ S.user=null; go('public'); },
  tab:id=>{ S.tab=id; S.filter='Tous'; render(); scrollTo(0,0); },
  filter:id=>{ S.filter=id; render(); },
  close:closeSheet,
  hwDetail, doHw, openCourse, readMsg, newHw, newCourse,
  newMsg:id=>newMsg(id), newStudent:()=>newStudent(),
  reqDone:id=>{ S.reqs.find(r=>r.id===id).done=true; render(); toast('Demande archivée'); },
  convert:id=>{ const r=S.reqs.find(x=>x.id===id); newStudent({req:id,name:r.name,email:r.contact.includes('@')?r.contact:'',subject:r.subject,mode:r.mode==='À domicile'?'À domicile':'En ligne'}); },
  remind:v=>{ const [hid,sid]=v.split('|'), h=S.hw.find(x=>x.id===hid);
    S.msgs.push({id:nid('m'),from:'prof',to:sid,subject:'Rappel : '+h.title,body:`N'oublie pas de rendre ce devoir avant le ${fmt(h.due)}.`,date:iso(),readBy:['prof']});
    toast('Rappel ajouté aux messages de '+stu(sid).name.split(' ')[0]); }
};
const FORM = {
  contact:(f)=>{ S.reqs.unshift({id:nid('r'),name:f.get('name'),contact:f.get('contact'),level:f.get('level'),subject:f.get('subject'),mode:f.get('mode'),msg:f.get('msg'),date:iso(),done:false});
    toast('Demande enregistrée — visible dans l\'espace professeur (démo)'); return 'reset'; },
  login:()=>{ toast('Prototype : utilisez les boutons de démo ci-dessous'); },
  submitHw:(f,id)=>{ const file=f.get('file'), text=f.get('text').trim();
    if((!file||!file.name)&&!text){ toast('Ajoute un fichier ou une réponse'); return; }
    S.hw.find(h=>h.id===id).subs[S.user]={text,file:file&&file.name?file.name:'',date:iso()};
    closeSheet(); render(); toast('Devoir rendu ✔'); },
  grade:(f,v)=>{ const [hid,sid]=v.split('|'), s=S.hw.find(h=>h.id===hid).subs[sid];
    if(!f.get('grade').trim()){ toast('Indiquez une note'); return; }
    s.grade=f.get('grade').trim(); s.comment=f.get('comment').trim(); render(); hwDetail(hid); toast('Correction enregistrée — l\'élève la voit dans ses devoirs'); },
  newHw:(f)=>{ const to=f.getAll('to'); if(!to.length){ toast('Choisissez au moins un élève'); return; }
    S.hw.push({id:nid('h'),subject:f.get('subject'),title:f.get('title'),desc:f.get('desc'),due:f.get('due'),to,subs:{}});
    closeSheet(); render(); toast('Devoir publié pour '+to.length+' élève(s)'); },
  newCourse:(f)=>{ const to=f.getAll('to'); if(!to.length){ toast('Choisissez au moins un élève'); return; }
    const file=f.get('file');
    S.courses.push({id:nid('c'),subject:f.get('subject'),type:f.get('type'),title:f.get('title'),file:file&&file.name?file.name:'document',date:iso(),to});
    closeSheet(); S.filter='Tous'; render(); toast('Cours partagé'); },
  newMsg:(f)=>{ const to=f.get('to');
    S.msgs.push({id:nid('m'),from:S.user,to,subject:f.get('subject'),body:f.get('body'),date:iso(),readBy:[S.user]});
    closeSheet(); render();
    toast(isProf()?(f.get('email')?'Message ajouté à l\'espace élève (démo — l\'email sera envoyé dans la version en ligne)':'Message ajouté à l\'espace élève'):'Message transmis au professeur (démo)'); },
  reply:(f,v)=>{ const [mid,to]=v.split('|'), m=S.msgs.find(x=>x.id===mid);
    S.msgs.push({id:nid('m'),from:S.user,to,subject:'Re : '+m.subject.replace(/^Re : /,''),body:f.get('body'),date:iso(),readBy:[S.user]});
    closeSheet(); render(); toast('Réponse envoyée (démo)'); },
  newStudent:(f,req)=>{ const subjects=f.getAll('subjects'); if(!subjects.length){ toast('Choisissez au moins une matière'); return; }
    S.students.push({id:nid('s'),name:f.get('name'),email:f.get('email'),level:f.get('level'),mode:f.get('mode'),subjects});
    if(req) S.reqs.find(r=>r.id===req).done=true;
    closeSheet(); render(); toast('Élève ajouté (démo — invitation par email dans la version en ligne)'); }
};
document.addEventListener('click', e=>{ const t=e.target.closest('[data-act]'); if(!t) return; e.preventDefault(); ACT[t.dataset.act]?.(t.dataset.id, t); });
document.addEventListener('submit', e=>{ const f=e.target.closest('form[data-form]'); if(!f) return; e.preventDefault();
  const r=FORM[f.dataset.form]?.(new FormData(f), f.dataset.id); if(r==='reset') f.reset(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });
render();
</script>
</body>
</html>
